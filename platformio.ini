# ------------------------------------------------------------
# PlatformIO Project Configuration
# ------------------------------------------------------------
# esp32dev : flash firmware to the ESP32 over USB
#
# For PC-only testing without hardware, see the Testing section in README.md —
# src/main.cpp depends on Arduino.h, so a PlatformIO "native" env can't build it;
# test/test_modbus_protocol.cpp is compiled directly with a PC g++ instead.
# ------------------------------------------------------------

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200  ; match Serial.begin(115200) in main.cpp
